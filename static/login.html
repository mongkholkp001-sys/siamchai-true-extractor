<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | Siamchai & True Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] },
          colors: {
            brand: { 50: '#f0f7ff', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100 font-sans">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-rose-500 p-0.5 shadow-xl shadow-indigo-500/20 mb-4">
        <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center">
          <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
      </div>
      <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-sky-400 via-indigo-300 to-rose-400 bg-clip-text text-transparent">
        Customer Data Hub
      </h1>
      <p class="text-slate-400 text-sm mt-1">ระบบดึงข้อมูลอัตโนมัติ สยามชัย & ทรู (Unified Extractor)</p>
    </div>

    <!-- Login Box -->
    <div class="glass-card rounded-2xl p-8 shadow-2xl">
      <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
        <div>
          <h2 class="text-lg font-semibold text-white">ลงชื่อเข้าใช้งาน</h2>
          <p class="text-xs text-slate-400 mt-0.5">กรุณาเข้าสู่ระบบเพื่อจำกัดสิทธิ์ความปลอดภัย</p>
        </div>
        <span class="px-2.5 py-1 text-xs font-medium rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          Protected
        </span>
      </div>

      <div id="error-alert" class="hidden mb-5 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span id="error-text">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">ชื่อผู้ใช้งาน (Username)</label>
          <div class="relative">
            <input type="text" id="username" required autocomplete="username"
                   class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all"
                   placeholder="ระบุ Username">
            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">รหัสผ่าน (Password)</label>
          <div class="relative">
            <input type="password" id="password" required autocomplete="current-password"
                   class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all"
                   placeholder="ระบุรหัสผ่าน">
            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs pt-1 text-slate-400">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="remember" checked class="rounded border-slate-700 bg-slate-900 text-sky-500 focus:ring-sky-500 focus:ring-offset-slate-900">
            <span>จดจำการเข้าสู่ระบบ</span>
          </label>
          <span class="text-slate-500">ค่าเริ่มต้น: admin / password123</span>
        </div>

        <button type="submit" id="btn-submit"
                class="w-full mt-2 py-3 px-4 rounded-xl font-medium text-sm text-white bg-gradient-to-r from-sky-500 via-indigo-600 to-indigo-700 hover:from-sky-400 hover:to-indigo-600 shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2">
          <span>เข้าสู่ระบบ Dashboard</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-800/80 text-center">
        <p class="text-xs text-slate-500">
          สามารถเปลี่ยนรหัสผ่านได้ที่เมนูการตั้งค่าภายในระบบ
        </p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errAlert = document.getElementById('error-alert');
    const errText = document.getElementById('error-text');
    const btnSubmit = document.getElementById('btn-submit');

    // Auto-fill default hint
    if (!document.getElementById('username').value) {
      document.getElementById('username').value = 'admin';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errAlert.classList.add('hidden');
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>กำลังตรวจสอบสิทธิ์...</span>';

      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok && data.status === 'ok') {
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('auth_user', data.username);
          window.location.href = '/';
        } else {
          errText.textContent = data.detail || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
          errAlert.classList.remove('hidden');
        }
      } catch (err) {
        errText.textContent = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ' + err.message;
        errAlert.classList.remove('hidden');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>เข้าสู่ระบบ Dashboard</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>';
      }
    });
  </script>
</body>
</html>
